name: Production Deployment

on:
  push:
    branches: [ "production" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: registry.infano.care
        username: ${{ secrets.REGISTRY_UNAME }}
        password: ${{ secrets.REGISTRY_PWD }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: registry.infano.care/infano.api:prod-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Copy docker-compose file
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: root
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: 22
        source: "docker-compose.prod.yml"
        target: "/data/infano-prod/"
        debug: true

    - name: deploy api to production server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: root
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: 22
        debug: true
        script: |
          echo "${{ secrets.REGISTRY_PWD }}" | docker login registry.infano.care -u "${{ secrets.REGISTRY_UNAME }}" --password-stdin
          docker pull registry.infano.care/infano.api:prod-latest
          mkdir -p /data/infano-prod
          cd /data/infano-prod
          
          # Clean up any existing/conflicting containers to prevent recreation/rename errors
          docker rm -f infano-api-prod || true
          docker rm -f $(docker ps -a -q --filter "name=_infano-api-prod") 2>/dev/null || true
          
          # Deploy with production compose
          docker-compose -f docker-compose.prod.yml up -d
          
