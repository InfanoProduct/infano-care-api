name: Production Deployment

on:
  push:
    branches: [ "production" ]
  pull_request:
    branches: [ "production" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker registry
      uses: docker/login-action@v3
      with:
        registry: registry.pocapi.in
        username: ${{ secrets.REGISTRY_UNAME }}
        password: ${{ secrets.REGISTRY_PWD }}
        
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: registry.pocapi.in/infano.api:prod-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: false

    - name: Copy docker-compose file
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: root
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: 22
        source: "docker-compose.prod.yml"
        target: "/data/infano-prod/"
        debug: true

    - name: deploy api to production server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SSH_HOST }}
        username: root
        password: ${{ secrets.PROD_SSH_PASSWORD }}
        port: 22
        debug: true
        script: |
          docker login registry.pocapi.in -u "${{ secrets.REGISTRY_UNAME }}" -p "${{ secrets.REGISTRY_PWD }}"
          docker pull registry.pocapi.in/infano.api:prod-latest
          mkdir -p /data/infano-prod
          cd /data/infano-prod
          
          # Deploy with production compose
          docker-compose -f docker-compose.prod.yml up -d
          
